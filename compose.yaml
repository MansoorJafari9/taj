name: taj

x-backend: &backend
  image: 188.212.97.228:5000/taj-back:${IMAGE_TAG:-latest}
  init: true
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment: &backend-env
    NODE_ENV: production
    APP_ENV: prod
    VENDURE_SERVER_PORT: "3000"
    DB_HOST: ${DB_HOST:?Set DB_HOST in .env.production}
    DB_PORT: ${DB_PORT:-5432}
    DB_NAME: ${DB_NAME:-vendure}
    DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env.production}
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
    COOKIE_SECRET: ${COOKIE_SECRET:?Set COOKIE_SECRET in .env.production}
    SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-superadmin}
    SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:?Set SUPERADMIN_PASSWORD in .env.production}
    CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env.production}
    STOREFRONT_URL: ${STOREFRONT_URL:?Set STOREFRONT_URL in .env.production}
    ASSET_URL_PREFIX: ${ASSET_URL_PREFIX:?Set ASSET_URL_PREFIX in .env.production}
    ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-}
    ZARINPAL_SANDBOX: ${ZARINPAL_SANDBOX:-true}
  volumes:
    - assets:/app/static/assets
    - email-output:/app/static/email/test-emails
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  migrate:
    <<: *backend
    restart: "no"
    command:
      - node
      - -e
      - >-
        const { runMigrations } = require('@vendure/core');
        const { config } = require('./dist/vendure-config');
        runMigrations(config)
        .then(result => { console.log('Applied migrations:', result); process.exit(process.exitCode || 0); })
        .catch(error => { console.error(error); process.exit(1); });

  backend:
    <<: *backend
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/shop-api', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({query: '{ __typename }'})
          }).then(async response => {
          const body = await response.json();
          if (!response.ok || !body.data || body.errors) process.exit(1);
          }).catch(() => process.exit(1));
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  worker:
    <<: *backend
    command: ["node", "dist/index-worker.js"]
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    image: 188.212.97.228:5000/taj-front:${IMAGE_TAG:-latest}
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "3001"
      NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL:?Set NUXT_PUBLIC_API_BASE_URL in .env.production}
      NUXT_PUBLIC_SITE_URL: ${STOREFRONT_URL:?Set STOREFRONT_URL in .env.production}
      NUXT_PUBLIC_CHANNEL_TOKEN: ${NUXT_PUBLIC_CHANNEL_TOKEN:-}
    ports:
      - "${STOREFRONT_PORT:-3001}:3001"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3001/robots.txt')
          .then(response => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1));
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  assets:
  email-output:
