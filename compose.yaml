x-backend: &backend
  image: 188.212.97.228:5000/taj-back:${IMAGE_TAG:-latest}
  init: true
  env_file:
    - ${BACKEND_ENV_FILE:-./panel/.env}
  environment:
    NODE_ENV: production
    APP_ENV: prod
    VENDURE_SERVER_PORT: "3000"
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_NAME: ${POSTGRES_DB:?Set POSTGRES_DB in the root .env}
    DB_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in the root .env}
    DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
  volumes:
    - assets:/app/static/assets
    - email-output:/app/static/email/test-emails
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the root .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the root .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  registry:
    image: registry:2
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      REGISTRY_HTTP_ADDR: "0.0.0.0:5000"
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: "Private Registry"
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
    volumes:
      - registry_data:/var/lib/registry
      - ./auth:/auth:ro

  migrate:
    <<: *backend
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - node
      - -e
      - >-
        const { runMigrations } = require('@vendure/core');
        const { config } = require('./dist/vendure-config');
        runMigrations(config)
        .then(result => { console.log('Applied migrations:', result); process.exit(process.exitCode || 0); })
        .catch(error => { console.error(error); process.exit(1); });

  backend:
    <<: *backend
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/shop-api', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({query: '{ __typename }'})
          }).then(async response => {
          const body = await response.json();
          if (!response.ok || !body.data || body.errors) process.exit(1);
          }).catch(() => process.exit(1));
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  worker:
    <<: *backend
    command: ["node", "dist/index-worker.js"]
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    image: 188.212.97.228:5000/taj-front:${IMAGE_TAG:-latest}
    init: true
    restart: unless-stopped
    env_file:
      - ${FRONTEND_ENV_FILE:-./taj/.env}
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "3001"
    ports:
      - "${STOREFRONT_PORT:-3001}:3001"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3001/robots.txt')
          .then(response => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1));
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  registry_data:
  assets:
  email-output:
